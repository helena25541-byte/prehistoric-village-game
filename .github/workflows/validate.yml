
name: Validate Godot Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'prehistoric-tribe-source.zip'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Extract Project
        run: |
          unzip -o prehistoric-tribe-source.zip -d .

      - name: Validate Project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path prehistoric-tribe --editor --quit

      - name: Package Source
        run: |
          zip -r prehistoric-tribe-source-validated.zip prehistoric-tribe -x "prehistoric-tribe/.godot/*"

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-tribe-source-validated
          path: prehistoric-tribe-source-validated.zip

