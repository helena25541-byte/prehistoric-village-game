
name: Build Prehistoric Tribe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'prehistoric-tribe-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Download game source
        shell: bash
        run: |
          unzip -o prehistoric-tribe-source.zip -d .
          test -f prehistoric-tribe/project.godot
          test -f prehistoric-tribe/scripts/main.gd

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d template_temp

          cp -a template_temp/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/temurin-17-jdk-amd64"
          EOF

      - name: Import and check project scripts
        shell: bash
        run: |
          set -o pipefail

          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/prehistoric-tribe" \
            --quit 2>&1 | tee godot-check.log

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-check.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail

          APK_DIR="$GITHUB_WORKSPACE/prehistoric-tribe/build"
          APK_PATH="$APK_DIR/PrehistoricTribe.apk"

          mkdir -p "$APK_DIR"

          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/prehistoric-tribe" \
            --export-debug "Android" "$APK_PATH" \
            2>&1 | tee godot-export.log

          if grep -E "SCRIPT ERROR|Parse Error|Project export.*failed" godot-export.log; then
            echo "APK export failed."
            exit 1
          fi

          test -s "$APK_PATH"

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Prehistoric-Tribe-Android-APK
          path: prehistoric-tribe/build/PrehistoricTribe.apk
          if-no-files-found: error
