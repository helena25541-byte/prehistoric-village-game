name: Build Prehistoric Tribe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'prehistoric-tribe-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game source
        run: |
          unzip -o prehistoric-tribe-source.zip -d .
          test -f prehistoric-tribe/project.godot
          test -f prehistoric-tribe/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Download Godot 4.7.2 editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install matching Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path prehistoric-tribe --quit

      - name: Export Android APK
        run: |
          mkdir -p prehistoric-tribe/build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path prehistoric-tribe --export-debug "Android" prehistoric-tribe/build/PrehistoricTribe.apk
          test -s prehistoric-tribe/build/PrehistoricTribe.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Prehistoric-Tribe-Android-APK
          path: prehistoric-tribe/build/PrehistoricTribe.apk
          if-no-files-found: error
