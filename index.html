
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prehistoric Village</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#163d31;color:#fff8df;font-family:system-ui,Arial,sans-serif}
header{padding:16px;background:#214c39;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0}
small{color:#d7e7c7}
.stats{display:flex;justify-content:space-around;gap:7px;padding:12px;background:#17382d}
.stat{background:#285540;border-radius:12px;padding:10px 5px;text-align:center;flex:1;font-size:13px}
.stat b{display:block;font-size:17px;margin-top:4px}
main{padding:12px;max-width:700px;margin:auto}
.land{min-height:310px;border:3px solid #547d48;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(160deg,#82c96c,#4e9a52 55%,#28734a);padding:14px}
.land:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 15%,#b4dd78 0 5%,transparent 6%),radial-gradient(ellipse at 85% 28%,#b4dd78 0 7%,transparent 8%),radial-gradient(ellipse at 40% 85%,#2d8548 0 10%,transparent 11%);pointer-events:none}
.land-title{position:relative;text-align:center;font-weight:800;text-shadow:0 2px 4px #255b36}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:15px}
.tile{min-height:91px;border:1px solid #ffffff45;border-radius:14px;background:#ffffff1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;text-align:center}
.tile .emoji{font-size:32px}
.tile.empty{border:2px dashed #e3efb577}
.panel{background:#214c39;padding:14px;border-radius:17px;margin-top:13px}
h2{font-size:16px;margin:0 0 10px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:12px;padding:12px 8px;font-size:14px;font-weight:700;background:#f4ce7a;color:#49371d;cursor:pointer}
button:active{transform:scale(.98)}
button.secondary{background:#d3e8bc;color:#21452e}
button:disabled{opacity:.45}
#message{font-size:13px;line-height:1.7;color:#f5e6b9;min-height:24px}
.progress{height:9px;border-radius:10px;background:#142f27;overflow:hidden}
#bar{height:100%;width:0;background:#f4ce7a;transition:width .3s}
footer{text-align:center;padding:18px;color:#c3d8bf;font-size:11px}
</style>
</head>
<body>
<header>
  <div><h1>🌿 Prehistoric Village</h1><small>A world waiting to grow</small></div>
  <div style="text-align:right">LEVEL <b id="level">1</b><br><small id="xp">0 / 100 XP</small></div>
</header>

<div class="stats">
  <div class="stat">🍓 Berries<b id="berries">30</b></div>
  <div class="stat">🪵 Wood<b id="wood">25</b></div>
  <div class="stat">🪨 Stone<b id="stone">10</b></div>
</div>

<main>
  <section class="land">
    <div class="land-title">🏞️ YOUR LITTLE VALLEY</div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <h2>🌱 Gather Resources</h2>
    <div class="buttons">
      <button onclick="gather('berries')">🍓 Gather Berries</button>
      <button onclick="gather('wood')">🪵 Collect Wood</button>
      <button class="secondary" onclick="gather('stone')">🪨 Collect Stone</button>
      <button class="secondary" onclick="saveGame(true)">💾 Save Game</button>
    </div>
  </section>

  <section class="panel">
    <h2>🔨 Build Your Village</h2>
    <div class="buttons">
      <button onclick="build('hut')">🛖 Build Hut<br><small>20 wood · 10 berries</small></button>
      <button onclick="build('farm')">🌾 Build Farm<br><small>15 wood · 10 stone</small></button>
      <button onclick="build('workshop')">🪨 Build Workshop<br><small>25 wood · 15 stone</small></button>
      <button class="secondary" onclick="expand()">🗺️ Explore Valley<br><small>50 berries · 30 wood</small></button>
    </div>
  </section>

  <section class="panel">
    <h2>⭐ Village Progress</h2>
    <div class="progress"><div id="bar"></div></div>
    <p id="message" aria-live="polite">Welcome! Gather resources and build your first hut.</p>
    <button class="secondary" style="width:100%" onclick="resetGame()">↻ Restart Village</button>
  </section>
</main>
<footer>PREHISTORIC VILLAGE · EARLY DEMO 0.1</footer>

<script>
const initial = () => ({
  berries:30, wood:25, stone:10, level:1, xp:0,
  buildings:[], explored:0
});
let game;
try {
  game = JSON.parse(localStorage.getItem("prehistoric-village-save")) || initial();
} catch(e) {
  game = initial();
}
let message = "Welcome! Gather resources and build your first hut.";

const costs = {
  hut:{wood:20,berries:10},
  farm:{wood:15,stone:10},
  workshop:{wood:25,stone:15}
};
const icons = {hut:"🛖",farm:"🌾",workshop:"🪨"};
const names = {hut:"Hut",farm:"Farm",workshop:"Workshop"};

function saveGame(showMessage=false) {
  try {
    localStorage.setItem("prehistoric-village-save",JSON.stringify(game));
    if(showMessage) message="💾 Your village has been saved on this device!";
  } catch(e) {
    message="Could not save. Check your browser storage settings.";
  }
  render();
}
function gather(type) {
  const amounts={berries:10,wood:8,stone:5};
  game[type]+=amounts[type];
  game.xp+=5;
  message="You collected "+amounts[type]+" "+type+"!";
  levelUp();
  saveGame();
}
function canAfford(cost) {
  return Object.keys(cost).every(k=>game[k]>=cost[k]);
}
function build(type) {
  if(game.buildings.length>=9+game.explored*3) {
    message="Your valley is full. Explore to unlock more land!";
    render();return;
  }
  const cost=costs[type];
  if(!canAfford(cost)) {
    message="Not enough resources! Gather more first.";
    render();return;
  }
  Object.keys(cost).forEach(k=>game[k]-=cost[k]);
  game.buildings.push(type);
  game.xp+=30;
  message="Wonderful! Your "+names[type]+" is ready.";
  levelUp();
  saveGame();
}
function expand() {
  if(game.berries<50||game.wood<30) {
    message="You need 50 berries and 30 wood to explore.";
    render();return;
  }
  game.berries-=50;
  game.wood-=30;
  game.explored++;
  game.xp+=40;
  message="🌄 A new part of the valley has been discovered!";
  levelUp();
  saveGame();
}
function levelUp() {
  while(game.xp>=game.level*100) {
    game.xp-=game.level*100;
    game.level++;
    game.berries+=15;
    message="🎉 Village level "+game.level+" unlocked! Bonus: 15 berries.";
  }
}
function resetGame() {
  if(!confirm("Start a new village? Your saved progress will be lost."))return;
  game=initial();
  message="A new adventure begins!";
  saveGame();
}
function render() {
  ["berries","wood","stone","level","xp"].forEach(k=>{
    document.getElementById(k).textContent=game[k].toLocaleString();
  });
  document.getElementById("xp").textContent=
    game.xp+" / "+(game.level*100)+" XP";
  document.getElementById("bar").style.width=
    (game.xp/(game.level*100)*100)+"%";
  document.getElementById("message").textContent=message;

  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const slots=9+game.explored*3;
  for(let i=0;i<slots;i++) {
    const tile=document.createElement("div");
    tile.className="tile";
    if(game.buildings[i]) {
      const type=game.buildings[i];
      tile.innerHTML='<span class="emoji">'+icons[type]+'</span><span>'+names[type]+'</span>';
    } else {
      tile.classList.add("empty");
      tile.innerHTML='<span class="emoji">🌱</span><span>Empty land</span>';
    }
    grid.appendChild(tile);
  }
}
render();
</script>
</body>
</html>
